[package]
name = "janmp"
version = "0.1.0"
edition = "2021"
description = "Desktop music player in the spirit of AIMP, written in Rust + egui"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["image"] }
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
rubato = "5"
rtrb = "0.4"
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
crossbeam-channel = "0.5"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
parking_lot = "0.13"
log = "0.4"
env_logger = "0.11"
rand = "0.9"
rustfft = "6"
encoding_rs = "0.8"
ureq = "3"
hound = "3"
global-hotkey = "0.9.0"
rustysynth = "1.3.8"
oxideav-ape = { version = "0.0.4", default-features = false }
ape-decoder = "0.3"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
trash = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
